# Ruff configuration for claude-skills.
#
# Pin the CLI to the version this baseline was set against:
#     uvx ruff@0.16.0 check .
# 0.16.0 enabled 413 default rules (up from 59). Running an unpinned "ruff"
# will drift as new defaults land.

target-version = "py312"

extend-exclude = [
    "plugins",      # generated by registry/generate.py — fix the source skill dirs
    "**/parsers",   # vendored tree-sitter grammar binaries
]

[lint]
ignore = [
    # Skill scripts intentionally swallow exceptions around optional imports,
    # bundled-parser fallbacks, and best-effort filesystem probes. A failed
    # probe must degrade, not crash the agent mid-task.
    "BLE001",  # blind-except
    "S110",    # try-except-pass

    # Skills are invoked as `python3 scripts/foo.py`, never executed directly.
    # The shebangs are documentation of the interpreter, not an exec contract.
    "EXE001",  # shebang-not-executable
]
